lockfile: false
resolutionMode: highest

packages:
  - packages/*

publicHoistPattern:
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*postcss*'
  - '*prettier*'
  - '*remark*'
  - '*semantic-release*'
  - '*stylelint*'

overrides:
  katex: ^0.18.1

patchedDependencies:
  conventional-changelog-gitmoji-config@1.5.2: patches/conventional-changelog-gitmoji-config@1.5.2.patch

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
