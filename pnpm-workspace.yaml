lockfile: false
# @lobehub/ui depends on @lobehub/streamdown by plain semver, not `workspace:`:
# npm sends the on-disk manifest to the registry before prepack runs, so a
# `workspace:` range survives into the packument even when the tarball is
# rewritten — and pnpm resolves consumers against the packument.
linkWorkspacePackages: true
resolutionMode: highest

packages:
  - packages/*

publicHoistPattern:
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*postcss*'
  - '*prettier*'
  - '*remark*'
  - '*semantic-release*'
  - '*stylelint*'

overrides:
  katex: ^0.18.1

patchedDependencies:
  conventional-changelog-gitmoji-config@1.5.2: patches/conventional-changelog-gitmoji-config@1.5.2.patch

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

# @lobehub/streamdown is published from lobehub/streamdown and consumed here as
# a plain registry dependency, so its newest release can be younger than the
# default minimumReleaseAge window.
minimumReleaseAgeExclude:
  - '@lobehub/streamdown@1.3.0'
