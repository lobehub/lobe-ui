name: Release CI
on:
  push:
    branches:
      - master
      - alpha
      - beta
      - rc
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release (bypass conventional commits)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      release_type:
        description: 'Release type (when force release is true)'
        required: false
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'

# Every job here ends by pushing a release commit to the branch, so two runs
# must never overlap.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for semantic-release to push tags and commits
  issues: write # Required for semantic-release to create issues
  pull-requests: write # Required for semantic-release to comment on PRs

jobs:
  # @lobehub/ui depends on @lobehub/streamdown by semver range, so streamdown
  # must reach npm first — otherwise a ui release can ship a dependency on a
  # version that does not exist yet.
  streamdown:
    name: Streamdown
    uses: ./.github/workflows/release-streamdown.yml
    secrets: inherit

  release:
    name: Release
    needs: streamdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: pnpm install

      - name: CI
        run: pnpm run ci

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # If the streamdown version this repo builds against was never published
      # (e.g. the change carried no `streamdown`-scoped commit), @lobehub/ui
      # would ship against a package that does not exist — and an npm publish
      # cannot be taken back. Fail loudly here instead.
      - name: Verify streamdown dependency is published
        run: |
          VERSION=$(node -p "require('./packages/streamdown/package.json').version")
          if ! npm view "@lobehub/streamdown@$VERSION" version > /dev/null 2>&1; then
            echo "::error::@lobehub/streamdown@$VERSION is not on npm. The @lobehub/ui tarball would depend on a nonexistent version. Ensure the change includes a 'streamdown'-scoped commit so the streamdown job publishes it first."
            exit 1
          fi
          echo "@lobehub/streamdown@$VERSION is published."

      - name: Force Release Commit
        if: github.event.inputs.force_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "🔧 chore(release): force ${{ github.event.inputs.release_type }} release"

      - name: Release @lobehub/ui
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  docs-kit:
    name: Docs Kit
    needs: release
    uses: ./.github/workflows/release-docs-kit.yml
    secrets: inherit
