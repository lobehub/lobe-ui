name: Test CI
on:
  pull_request:
  push:
    branches:
      - '!main'
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # Bun cannot read pnpm-workspace.yaml; see release.yml for why this is not
      # committed to package.json.
      - name: Declare bun workspaces
        run: npm pkg set 'workspaces[0]=packages/*'

      - name: Install deps
        run: bun i

      - name: CI
        run: bun run ci

      - name: Test and coverage
        run: bun run test:coverage

      - name: Documentation verification
        run: |
          bunx vitest run packages/docs-kit/site
          bun run docs:build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
