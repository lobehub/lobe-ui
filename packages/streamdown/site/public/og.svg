<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Streamdown — headless streaming markdown for React">
  <rect width="1200" height="630" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#wash)"/>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0070f3" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3291ff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0070f3" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <g fill="#ffffff">
    <rect x="840" y="118" width="260" height="14" rx="7" opacity="0.18"/>
    <rect x="840" y="148" width="220" height="14" rx="7" opacity="0.28"/>
    <rect x="840" y="178" width="246" height="14" rx="7" opacity="0.4"/>
    <rect x="840" y="208" width="188" height="14" rx="7" opacity="0.55"/>
    <rect x="840" y="238" width="232" height="14" rx="7" fill="url(#stream)"/>
    <rect x="840" y="288" width="260" height="10" rx="5" opacity="0.12"/>
    <rect x="840" y="314" width="200" height="10" rx="5" opacity="0.18"/>
    <rect x="840" y="340" width="228" height="10" rx="5" opacity="0.24"/>
    <rect x="840" y="366" width="164" height="10" rx="5" opacity="0.32"/>
    <rect x="840" y="412" width="248" height="72" rx="12" opacity="0.08"/>
  </g>

  <text x="72" y="92" fill="#a1a1a1" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="0.04em">@lobehub/streamdown</text>
  <text x="72" y="250" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="92" font-weight="600" letter-spacing="-0.04em">Streamdown</text>
  <text x="72" y="330" fill="#a1a1a1" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="32" font-weight="400">Render markdown as it arrives.</text>
  <text x="72" y="560" fill="#717171" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22">streamdown.lobehub.com</text>
  <text x="1128" y="560" fill="#717171" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" text-anchor="end">LobeHub</text>
</svg>
